databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack_db
    user: fintrack_user

services:
  - type: web
    name: fintrack-api
    plan: free
    env: docker
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
